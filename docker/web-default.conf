server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA is one page; anything unmatched falls back to it rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must never be cached or a redeploy leaves stale JS pointing
        # at an API that has moved on.
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
    # The Cornerstone bundle is 3.8 MB and each volume pack is ~12 MB of raw
    # uint8, which compresses hard -- a labelmap especially, being mostly zeros.
    # octet-stream is included deliberately for the .raw files.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/octet-stream model/stl;
    gzip_min_length 512;
    gzip_comp_level 5;
}

# Full nginx.conf (replaces the image's), so the .glb mime type and the three cache
# tiers are all in one place.
# No `user` directive: the master does not run as root (see the Dockerfile's USER),
# so nginx ignores it and warns on every start.
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
# The pid lives in the cache directory rather than /var/run, so an unprivileged
# nginx needs exactly ONE writable path instead of two. /var/run is a symlink to
# /run in alpine and `chown -R` does not follow it, so chowning it silently did
# nothing and nginx still died on "open() /var/run/nginx.pid failed (13: Permission
# denied)" after the cache directory was already fixed.
pid        /var/cache/nginx/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Stock mime.types has no .glb. The meshopt decoder embeds its wasm as base64,
  # so no separate .wasm type is needed.
  types { model/gltf-binary  glb; }

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;
  access_log      off;

  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   512;
  gzip_vary         on;
  # .glb is deliberately absent: meshopt output is already compressed, and gzipping
  # it costs CPU to make it very slightly bigger.
  # woff2 is deliberately absent as well as .glb: a woff2 is already Brotli-
  # compressed internally, so gzipping it costs CPU for a rounding error.
  gzip_types text/plain text/css application/javascript application/json
             application/ld+json image/svg+xml;

  server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;

    # `^~`, not a plain prefix. nginx checks REGEX locations before prefix ones, so
    # the \.(css|js)$ block below was winning for everything under /assets/ --
    # including the 1.3 MB vendored three.module.js, which was then served
    # no-cache and revalidated on every page load, defeating the whole point of
    # content-hashing these assets. `^~` stops the regex search on a prefix match.
    #
    # Safe to be immutable: GLB filenames carry a content hash, and the one stable
    # URL in here (arch.assets.json) is fetched by hero3d.js with cache:"no-cache"
    # plus ?v=BUILD precisely so it can never be stranded.
    location ^~ /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # HTML always revalidates, so a redeploy is visible immediately.
    location / {
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-cache";
    }

    # styles.css and main.js sit at the root on stable URLs. Repeat visitors kept
    # stale CSS for up to 4h on the sibling site; no-cache is the cheap fix.
    location ~* \.(css|js)$ {
      add_header Cache-Control "no-cache";
    }
  }
}

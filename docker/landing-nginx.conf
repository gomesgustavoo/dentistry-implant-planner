# Full nginx.conf (replaces the image's), so the .glb mime type and the three cache
# tiers are all in one place.
# No `user` directive: the master does not run as root (see the Dockerfile's USER),
# so nginx ignores it and warns on every start.
# ONE worker, not `auto`. `auto` reads the HOST's core count and not the cgroup's CPU
# quota, so on this 18-core node it spawned 18 workers inside a container limited to
# 200m -- eighteen processes contending for one fifth of one core, which is slower than
# one worker as well as larger. Measured in the pod: `nproc` reported 18, `ps` showed the
# master plus 18 workers, and both replicas had been OOMKilled 14 and 15 times against
# the 96Mi limit.
#
# Memory is the symptom rather than the disease. At idle the cgroup charged 14Mi, well
# under the limit, because nginx workers share most of their pages with the master
# copy-on-write. What blows the limit is load: `gzip_comp_level 6` allocates a zlib
# deflate context PER GZIPPING CONNECTION PER WORKER, so 18 workers set an eighteen-fold
# ceiling on that for a marketing page that cannot use the CPU to serve them anyway.
#
# The limit stays at 96Mi deliberately. Raising it would have hidden this rather than
# fixed it, and one worker leaves roughly a tenfold headroom instead of a tight fit.
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
# The pid lives in the cache directory rather than /var/run, so an unprivileged
# nginx needs exactly ONE writable path instead of two. /var/run is a symlink to
# /run in alpine and `chown -R` does not follow it, so chowning it silently did
# nothing and nginx still died on "open() /var/run/nginx.pid failed (13: Permission
# denied)" after the cache directory was already fixed.
pid        /var/cache/nginx/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Stock mime.types has no .glb. The meshopt decoder embeds its wasm as base64,
  # so no separate .wasm type is needed.
  # Nor .vtt: the film player's chapter track (/film/chapters.vtt) would go out as
  # application/octet-stream, and a <track> with the wrong type is dropped (Firefox
  # enforces text/vtt).
  types { model/gltf-binary  glb; text/vtt  vtt; }

  # The saved name of the ImplantPlan VR APK. Its URL carries a content hash
  # (/download/ImplantPlanVR-1.2.3-<sha8>.apk) so it can be immutable, but the page tells
  # people to run `adb install -r ImplantPlanVR-1.2.3.apk` and `shasum` on that name. The
  # <a download> attribute covers clicks on /vr/; this covers a copied or shared link.
  # The capture is the semver charset only, so nothing from the URI can reach the header
  # beyond those characters.
  map $uri $apk_disposition {
    default  "attachment";
    "~^/download/(?<apk_base>ImplantPlanVR-[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z_.]+)?)-[0-9a-f]{8}\.apk$"  'attachment; filename="$apk_base.apk"';
  }

  # The immutable tier is for content that exists. A 404 on a hashed URL is a real, transient
  # state during a two-replica rollout (the new pod's HTML can send a visitor to the old pod
  # for a new hash), and a plain add_header sends nothing on a 404, so Cloudflare kept it
  # ~3 min and told browsers max-age=14400. With `always` + this map, a 404 says no-store and
  # a 200/304 says immutable. (Range responses become 206 after add_header has run, so they
  # carry the 200 value.)
  map $status $immutable_cc {
    ~^(200|206|304)$  "public, max-age=31536000, immutable";
    default           "no-store";
  }

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;
  server_tokens   off;
  access_log      off;

  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   512;
  gzip_vary         on;
  # .glb is deliberately absent: meshopt output is already compressed, and gzipping
  # it costs CPU to make it very slightly bigger.
  # woff2 is deliberately absent as well as .glb: a woff2 is already Brotli-
  # compressed internally, so gzipping it costs CPU for a rounding error.
  # text/vtt is a few hundred bytes of plain text per locale; it rides the HTML tier.
  gzip_types text/plain text/css application/javascript application/json
             application/ld+json image/svg+xml text/vtt;

  server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;

    # `^~`, not a plain prefix. nginx checks REGEX locations before prefix ones, so
    # the \.(css|js)$ block below was winning for everything under /assets/ --
    # including the 1.3 MB vendored three.module.js, which was then served
    # no-cache and revalidated on every page load, defeating the whole point of
    # content-hashing these assets. `^~` stops the regex search on a prefix match.
    #
    # Safe to be immutable: GLB filenames carry a content hash, and the one stable
    # URL in here (arch.assets.json) is fetched by hero3d.js with cache:"no-cache"
    # plus ?v=BUILD precisely so it can never be stranded.
    # Relative redirects: TLS ends at Cloudflare and the tunnel speaks plain http on
    # 8080, so an absolute "/es" -> "/es/" redirect would send visitors to http://…:8080.
    absolute_redirect off;

    # The legal pages moved from hand-written .html files into the localized build.
    location = /privacy.html { return 301 /privacy/; }
    location = /terms.html { return 301 /terms/; }

    location ^~ /_astro/ {
      add_header Cache-Control $immutable_cc always;
      try_files $uri =404;
    }

    location ~ ^/assets/(hero3d\.js|[^/]+\.assets\.json)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # ONE Cache-Control header. `expires 1y` emits its own "Cache-Control: max-age=31536000",
    # so pairing it with add_header sent two, and caches merge duplicates as they please.
    # A plain prefix on purpose, not `^~`: the regex block above must still win for
    # hero3d.js and *.assets.json, which are the two stable URLs in here.
    location /assets/ {
      add_header Cache-Control $immutable_cc always;
    }

    # The ImplantPlan VR APK. scripts/apk-manifest.mjs publishes it ONLY under a
    # content-hashed name, so unlike the sibling site's no-cache /download/ it can be
    # immutable: a new build is a new URL, and Cloudflare caches .apk by default.
    # The bare prefix is never a dead end: it goes to the page that explains the install.
    location = /download { return 302 /vr/; }
    location = /download/ { return 302 /vr/; }
    location ^~ /download/ {
      # A types block inside a location REPLACES the inherited map: only .apk is typed
      # here, everything else is octet-stream, and nothing here ever renders inline.
      types { application/vnd.android.package-archive  apk; }
      default_type application/octet-stream;
      # Cache-Control comes from $immutable_cc with `always`: immutable on 200/206/304,
      # no-store on a 404 (a rolling deploy can briefly send a visitor to the old pod for a
      # new APK, and that 404 must not be cached). Content-Disposition stays WITHOUT
      # `always`, or an error page would save as a file named like the APK.
      add_header Cache-Control $immutable_cc always;
      add_header Content-Disposition $apk_disposition;
      add_header X-Content-Type-Options "nosniff" always;
      gzip off;                       # an APK is already a compressed archive
      try_files $uri =404;
    }

    # HTML always revalidates, so a redeploy is visible immediately.
    location / {
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-cache";
    }

    # styles.css and main.js sit at the root on stable URLs. Repeat visitors kept
    # stale CSS for up to 4h on the sibling site; no-cache is the cheap fix.
    # (Neither file ships since 0.15.0 -- prepare-static.mjs dropped them -- but the rule
    # is free and keeps any future root-level script on the revalidating tier.)
    location ~* ^/[^/]+\.(css|js)$ {
      add_header Cache-Control "no-cache";
    }
  }
}

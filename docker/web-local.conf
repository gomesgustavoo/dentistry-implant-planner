# The self-hosted stack (compose.yaml): the static app at /, and the API proxied at /v1
# on the SAME origin -- the app derives its API base from where it was served
# (web/js/00-core.js: BASE + '/v1'), so two origins would mean CORS for nothing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A CBCT is hundreds of megabytes. Unbuffered, so the upload streams straight to the
    # API instead of being spooled to the proxy's disk first.
    client_max_body_size 1100m;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The hosted service mounts the app at /app; here it is the root.
    location = /app  { return 301 /; }
    location = /app/ { return 301 /; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/octet-stream model/stl;
    gzip_min_length 512;
    gzip_comp_level 5;
}

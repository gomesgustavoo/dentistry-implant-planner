apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dentistry-dentistry-headers@kubernetescrd
  name: dentistry-api
  namespace: dentistry
spec:
  ingressClassName: traefik
  rules:
  - host: dentistry.dicomsegvr.com
    http:
      paths:
      - backend:
          service:
            name: dentistry-api
            port:
              number: 8000
        path: /v1
        pathType: Prefix


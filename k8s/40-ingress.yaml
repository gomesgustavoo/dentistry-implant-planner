    traefik.ingress.kubernetes.io/router.middlewares: dentistry-dentistry-app-slash@kubernetescrd,dentistry-dentistry-app-strip@kubernetescrd,dentistry-dentistry-headers@kubernetescrd
  name: dentistry-app
  namespace: dentistry
spec:
  ingressClassName: traefik
  rules:
  - host: dentistry.dicomsegvr.com
    http:
      paths:
      - backend:

# An example: the four routes the app needs on one hostname (traefik). Copy it into your
# own overlay and set the host. The middlewares it names are traefik CRDs you define.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dentistry-dentistry-headers@kubernetescrd
  name: dentistry-api
  namespace: dentistry
spec:
  ingressClassName: traefik
  rules:
  - host: implantplan.example.com
    http:
      paths:
      - backend:
          service:
            name: dentistry-api
            port:
              number: 8000
        path: /v1
        pathType: Prefix

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: dentistry-dentistry-app-slash@kubernetescrd,dentistry-dentistry-app-strip@kubernetescrd,dentistry-dentistry-headers@kubernetescrd
  name: dentistry-app
  namespace: dentistry
spec:
  ingressClassName: traefik
  rules:
  - host: implantplan.example.com
    http:
      paths:
      - backend:
          service:
            name: dentistry-web
            port:
              number: 80
        path: /app
        pathType: Prefix

---
